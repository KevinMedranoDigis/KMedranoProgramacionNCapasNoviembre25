<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    </head>
    <body class="container">
        <div>
            <table class="table table-hover table-striped">
                <tr class="table-dark">
                    <th class="col-1">Accion</th>
                    <th class="col-3">Nombre</th>
                    <th class="col-3">Información</th>
                    <th class="col-5">Direcciones</th>
                </tr>

                <tr th:each="alumno : ${Alumnos}">
                    <td>
                        <a href="*" class="btn btn-warning"><i class="bi bi-pencil-square"></i></a> 
                        <a href="*" class="btn btn-danger"><i class="bi bi-trash3-fill"></i></a> 
                    </td>
                    <td th:text="|${alumno.Nombre} ${alumno.ApellidoPaterno}|"> </td>
                    <td>@Username <br/>correo@mail.com </td>
                    <td>
                        <ul>
                            <li>Dirección 1</li>
                            <li>Dirección 2</li>
                        </ul>
                    </td>
                </tr>

            </table>
        </div>
    </body>
</html>
